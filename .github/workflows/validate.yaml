name: Validate

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 4 * * 1"

jobs:
  validate:
    name: Lint & blueprint schema
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install tools
        run: pip install yamllint pyyaml

      - name: YAML lint
        run: >
          yamllint -d "{extends: relaxed, rules: {line-length: disable,
          trailing-spaces: {level: warning}}}" blueprints/ examples/

      - name: Blueprint schema check
        run: python .github/scripts/check_blueprints.py

  hassfest:
    name: Hassfest (integration)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Hassfest
        uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS validation (integration)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: HACS Action
        uses: hacs/action@main
        with:
          category: integration
          ignore: brands
